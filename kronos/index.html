<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kronos</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --link: #0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --link: #4493f8; } }
  body { background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif; margin: 0; padding: 48px 16px; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Kronos</h1>
  <p class="muted">A personal home assistant</p>
  <p>Kronos is a voice assistant that runs on its owner's own computer at home. It reads out the
     time, the weather, the owner's calendar and Google Tasks, and keeps track of lists.</p>
  <p>It is a private, single-user project and is not offered to the public.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
